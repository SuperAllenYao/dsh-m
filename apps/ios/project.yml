name: DSHm
options:
  bundleIdPrefix: com.dshm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    # Real-device builds: the APNs-enabled team is set below; Automatic signing.
    # Simulator builds keep CODE_SIGNING_ALLOWED=NO in scripts.
    CODE_SIGN_STYLE: Automatic
    # Set your own Apple Developer Team ID (Xcode > Signing & Capabilities) before
    # building for a physical device; simulator builds need no signing team.
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DSHm:
    type: application
    platform: iOS
    sources:
      - DSHm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshm.app
        CODE_SIGN_ENTITLEMENTS: DSHm/Resources/DSHm.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "DSH-m 需要使用相机扫描 Mac 上的配对二维码"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "DSH-m 需要访问局域网以连接你 Mac 上的 DSH 服务"
        INFOPLIST_KEY_NSBonjourServices: ["_dshm._tcp"]
        INFOPLIST_KEY_UIBackgroundModes: ["remote-notification"]
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "7"
    scheme:
      testTargets:
        - DSHmTests
  DSHmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DSHmTests
    dependencies:
      - target: DSHm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshm.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSHm.app/DSHm"
        BUNDLE_LOADER: "$(TEST_HOST)"
